<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benny, Lulu & Teddy — Scene 1</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#eaf7ff;color:#29485a;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}main{width:min(1000px,100%)}h1{margin:0 0 6px;font-size:clamp(1.3rem,3vw,2rem)}p{margin:0 0 16px;color:#5c7685}.frame{overflow:hidden;border-radius:20px;box-shadow:0 14px 40px #315d7628;background:#a8e5f8}svg{display:block;width:100%;height:auto}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0}button{border:0;border-radius:99px;background:#247b91;color:white;font-weight:700;padding:11px 19px;cursor:pointer}button:hover{background:#185d70}#clock{font-size:.9rem;color:#526e7e}.caption{background:white;border-radius:13px;padding:13px 16px;min-height:54px;line-height:1.45;box-shadow:0 4px 14px #315d7617}
#benny{animation:hop 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}#lulu{animation:step 1.1s ease-in-out infinite .12s;transform-box:fill-box;transform-origin:center bottom}#teddy{animation:step 1.25s ease-in-out infinite .22s;transform-box:fill-box;transform-origin:center bottom}
@keyframes hop{50%{transform:translateY(-18px)}}@keyframes step{50%{transform:translateY(-5px) rotate(2deg)}}
.cloud{animation:drift 22s linear infinite}@keyframes drift{to{transform:translateX(100px)}}
#magic{opacity:0;transition:opacity 2s} .reveal #magic{opacity:1}.spark{animation:twinkle 1.5s ease-in-out infinite}@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.25)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main>
<h1>Scene 1 — A Woodland Adventure</h1><p>40-second animated storybook scene · Press play to meet the friends</p>
<div class="frame" id="frame"><svg viewBox="0 0 960 540" role="img" aria-label="A sunny forest clearing with a white bunny in a blue waistcoat, an orange fox in a purple dress, and a brown bear in a green scarf. A rainbow appears between the trees.">
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#70d2f4"/><stop offset="1" stop-color="#dff8ff"/></linearGradient><linearGradient id="grass" x2="0" y2="1"><stop stop-color="#a4dc7d"/><stop offset="1" stop-color="#4fa96a"/></linearGradient><radialGradient id="glow"><stop stop-color="#fffbd0" stop-opacity=".9"/><stop offset="1" stop-color="#a6caff" stop-opacity="0"/></radialGradient></defs>
<rect width="960" height="540" fill="url(#sky)"/><circle cx="830" cy="85" r="43" fill="#ffe77d"/>
<g class="cloud" fill="white"><ellipse cx="150" cy="90" rx="65" ry="20"/><circle cx="130" cy="80" r="25"/><circle cx="170" cy="73" r="31"/><ellipse cx="490" cy="125" rx="50" ry="17"/><circle cx="475" cy="110" r="22"/><circle cx="510" cy="108" r="25"/></g>
<path d="M0 285Q180 190 360 275T720 260T960 250V540H0Z" fill="#a4d98e"/><path d="M0 340Q220 260 430 335T850 305T960 330V540H0Z" fill="#78c477"/><rect y="360" width="960" height="180" fill="url(#grass)"/>
<path d="M380 540Q470 440 435 390Q400 350 490 320Q560 290 540 250L650 250Q610 320 520 365Q475 400 530 455Q570 500 590 540Z" fill="#e7d09a"/>
<g fill="#438c5d"><circle cx="85" cy="250" r="100"/><circle cx="200" cy="270" r="78"/><circle cx="790" cy="250" r="110"/><circle cx="930" cy="265" r="105"/></g>
<path d="M75 390L95 120L130 120L150 390Z M780 400L810 95L850 95L885 405Z M875 400L895 165L925 165L950 410Z" fill="#91613e"/>
<g fill="#34865a"><circle cx="105" cy="140" r="90"/><circle cx="45" cy="190" r="65"/><circle cx="165" cy="190" r="70"/><circle cx="825" cy="125" r="108"/><circle cx="755" cy="185" r="78"/><circle cx="900" cy="185" r="88"/></g>
<g fill="#fff1a4"><circle cx="270" cy="430" r="5"/><circle cx="710" cy="420" r="5"/><circle cx="745" cy="460" r="4"/></g><g fill="#f58eb3"><circle cx="260" cy="455" r="5"/><circle cx="690" cy="455" r="5"/></g>
<!-- Benny: white bunny, pink ears, blue waistcoat -->
<g id="benny" transform="translate(340 365)"><ellipse cy="84" rx="40" ry="8" fill="#315e42" opacity=".2"/><ellipse cy="48" rx="28" ry="35" fill="#fffdf7"/><circle cy="5" r="30" fill="#fffdf7"/><ellipse cx="-14" cy="-30" rx="10" ry="34" fill="#fffdf7" transform="rotate(-12 -14 -30)"/><ellipse cx="13" cy="-32" rx="10" ry="35" fill="#fffdf7" transform="rotate(9 13 -32)"/><ellipse cx="-14" cy="-30" rx="4" ry="24" fill="#efa4b9"/><ellipse cx="13" cy="-32" rx="4" ry="25" fill="#efa4b9"/><circle cx="-10" cy="3" r="3.5" fill="#34485a"/><circle cx="11" cy="3" r="3.5" fill="#34485a"/><ellipse cy="14" rx="5" ry="4" fill="#ed9caf"/><path d="M-5 19Q0 25 6 19" fill="none" stroke="#8e6570" stroke-width="2"/><path d="M-23 38Q0 26 23 38L21 67Q0 77 -21 67Z" fill="#428fc4"/><path d="M-10 39L0 48L10 39" fill="none" stroke="#d8efff" stroke-width="3"/><ellipse cx="-15" cy="78" rx="15" ry="7" fill="#fffdf7"/><ellipse cx="16" cy="78" rx="15" ry="7" fill="#fffdf7"/></g>
<!-- Lulu: orange fox, cream muzzle, purple dress -->
<g id="lulu" transform="translate(475 370)"><ellipse cy="82" rx="40" ry="8" fill="#315e42" opacity=".2"/><ellipse cy="46" rx="29" ry="36" fill="#e98b42"/><circle cy="5" r="29" fill="#ed984d"/><path d="M-24 -10L-37 -62Q-15 -53 -7 -20Z M17 -16L36 -60Q44 -29 29 -6Z" fill="#df7b36"/><path d="M-29 -23L-34 -51L-18 -24Z M25 -20L34 -49L35 -17Z" fill="#f6b0a0"/><ellipse cy="17" rx="19" ry="15" fill="#fff0d9"/><circle cx="-10" cy="2" r="3.5" fill="#3b3c43"/><circle cx="11" cy="2" r="3.5" fill="#3b3c43"/><ellipse cx="1" cy="14" rx="4" ry="3" fill="#5b3d39"/><path d="M-5 21Q1 25 7 20" fill="none" stroke="#9a5e52" stroke-width="2"/><path d="M-25 36Q0 28 25 36L20 67Q0 77 -20 67Z" fill="#8f71c7"/><path d="M25 55Q56 48 53 72Q48 91 28 82" fill="none" stroke="#df7b36" stroke-width="12" stroke-linecap="round"/></g>
<!-- Teddy: cuddly brown bear, green scarf -->
<g id="teddy" transform="translate(610 378)"><ellipse cy="78" rx="44" ry="9" fill="#315e42" opacity=".2"/><ellipse cy="42" rx="36" ry="38" fill="#9b6846"/><circle cy="2" r="32" fill="#a8734e"/><circle cx="-25" cy="-22" r="13" fill="#a8734e"/><circle cx="25" cy="-22" r="13" fill="#a8734e"/><circle cx="-25" cy="-22" r="6" fill="#d99c85"/><circle cx="25" cy="-22" r="6" fill="#d99c85"/><ellipse cy="14" rx="19" ry="15" fill="#e8c29a"/><circle cx="-11" cy="0" r="3.5" fill="#332f31"/><circle cx="11" cy="0" r="3.5" fill="#332f31"/><ellipse cy="11" rx="5" ry="4" fill="#4b3430"/><path d="M-5 19Q0 24 6 19" fill="none" stroke="#704a3e" stroke-width="2"/><path d="M-29 33Q0 25 29 33L25 46L-25 46Z" fill="#65ae70"/><path d="M-5 31L-1 54L10 54L7 31" fill="#4c955e"/></g>
<g id="magic"><ellipse cx="575" cy="245" rx="190" ry="135" fill="url(#glow)"/><path d="M430 285Q575 65 720 285" fill="none" stroke="#ff7da4" stroke-width="12" stroke-linecap="round"/><path d="M445 285Q575 90 705 285" fill="none" stroke="#ffd56e" stroke-width="9"/><path d="M462 285Q575 120 688 285" fill="none" stroke="#79dba2" stroke-width="9"/><path d="M480 285Q575 150 670 285" fill="none" stroke="#77caff" stroke-width="9"/><g fill="#fffbd1"><path class="spark" d="M380 255l7 15 15 7-15 7-7 15-7-15-15-7 15-7Z"/><path class="spark" d="M740 210l6 13 13 6-13 6-6 13-6-13-13-6 13-6Z"/><path class="spark" d="M570 115l7 15 15 7-15 7-7 15-7-15-15-7 15-7Z"/></g></g>
<text x="28" y="510" fill="white" font-size="17" font-weight="700">A little kindness makes every adventure brighter</text></svg></div>
<div class="controls"><button id="play">▶ Play scene</button><button id="restart">↻ Restart</button><span id="clock" aria-live="polite">Ready · 00:00 / 00:40</span></div>
<div class="caption" id="caption" aria-live="polite">Narrator: In a bright, beautiful forest, three good friends are ready for a brand-new adventure.</div>
</main>
<script>
const frame=document.querySelector('#frame'),play=document.querySelector('#play'),restart=document.querySelector('#restart'),clock=document.querySelector('#clock'),caption=document.querySelector('#caption');
const cues=[[0,"Narrator: In a bright, beautiful forest, three good friends are ready for a brand-new adventure."],[7,"Benny: Come on, friends! Let's explore somewhere new!"],[13,"Lulu: Yay! I love adventures!"],[18,"Teddy: Me too! I wonder what we'll find today!"],[25,"Narrator: The friends giggle together and follow the winding woodland path."],[31,"Narrator: Suddenly… a magical rainbow light twinkles between the trees!"],[37,"Narrator: What could it be? Let's follow that sparkle!"]];
let elapsed=0,start=0,raf=0,running=false;
function tick(now){elapsed=Math.min(40,(now-start)/1000);const s=Math.floor(elapsed);clock.textContent=(running?'Playing':'Paused')+' · 00:'+String(s).padStart(2,'0')+' / 00:40';for(const [t,line] of cues)if(elapsed>=t)caption.textContent=line;if(elapsed>=30)frame.classList.add('reveal');if(elapsed>=40){running=false;play.textContent='▶ Play again';clock.textContent='Finished · 00:40 / 00:40';return}if(running)raf=requestAnimationFrame(tick)}
function begin(){if(elapsed>=40){elapsed=0;frame.classList.remove('reveal')}start=performance.now()-elapsed*1000;running=true;play.textContent='Ⅱ Pause';cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
play.onclick=()=>{if(running){running=false;cancelAnimationFrame(raf);play.textContent='▶ Resume';clock.textContent='Paused · 00:'+String(Math.floor(elapsed)).padStart(2,'0')+' / 00:40'}else begin()};
restart.onclick=()=>{running=false;cancelAnimationFrame(raf);elapsed=0;frame.classList.remove('reveal');play.textContent='▶ Play scene';clock.textContent='Ready · 00:00 / 00:40';caption.textContent=cues[0][1]};
</script></body></html>
